            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Approve response run
      tags:
      - Response Approvals
  /api/v1/response/approvals/{approval_id}/reject:
    post:
      consumes:
      - application/json
      parameters:
      - description: Approval ID
        in: path
        name: approval_id
        required: true
        type: string
      - description: Decision note
        in: body
        name: body
        schema:
