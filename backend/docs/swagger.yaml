        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get response approval
      tags:
      - Response Approvals
  /api/v1/response/approvals/{approval_id}/approve:
    post:
      consumes:
      - application/json
      parameters:
      - description: Approval ID
        in: path
        name: approval_id
        required: true
        type: string
      - description: Decision note
