host: localhost:8080
info:
  contact: {}
  description: Security API pour la plateforme Orchid WebShield.
  title: Orchid WebShield P3 API
  version: "1.0"
paths:
  /api/v1/connectors:
    get:
      description: Lists connectors for the administrator's tenant. Secrets and hashes
        are never returned.
      parameters:
      - description: Filter by active state
        in: query
        name: is_active
        type: boolean
      - description: Maximum results (1-100)
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List connectors
      tags:
      - Connectors
    post:
      consumes:
      - application/json
      description: Creates a tenant-scoped connector. The plaintext credential is
        returned only once.
      parameters:
      - description: Connector configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.ConnectorCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.ConnectorResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create connector
      tags:
      - Connectors
  /api/v1/connectors/{connector_id}:
    get:
      parameters:
      - description: Connector UUID
        in: path
        name: connector_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ConnectorResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get connector
      tags:
      - Connectors
    patch:
      consumes:
      - application/json
      parameters:
      - description: Connector UUID
        in: path
        name: connector_id
        required: true
        type: string
      - description: Connector changes
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.ConnectorUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ConnectorResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update connector
      tags:
      - Connectors
  /api/v1/connectors/{connector_id}/revoke:
    post:
      description: Disables a connector and records its revocation timestamp.
      parameters:
      - description: Connector UUID
        in: path
        name: connector_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ConnectorResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Revoke connector
      tags:
      - Connectors
  /api/v1/connectors/{connector_id}/rotate-secret:
    post:
      description: Replaces the connector key ID and secret. The new plaintext credential
        is returned once.
      parameters:
      - description: Connector UUID
        in: path
        name: connector_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ConnectorResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Rotate connector secret
      tags:
      - Connectors
  /api/v1/findings/{finding_id}/retests:
    get:
      description: Lists the retest history for a finding belonging to the authenticated
        tenant.
      parameters:
      - description: Finding ID
        in: path
        name: finding_id
        required: true
        type: string
      - description: Filter by result status
        in: query
        name: status
        type: string
      - description: Maximum results (1-100, default 50)
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List retests for a finding
      tags:
      - Retesting
  /api/v1/response/approvals:
    get:
      parameters:
      - description: pending, approved, or rejected
        in: query
        name: status
        type: string
      - description: Maximum results (1-100)
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List response approvals
      tags:
      - Response Approvals
  /api/v1/response/approvals/{approval_id}:
    get:
      parameters:
      - description: Approval ID
        in: path
        name: approval_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
